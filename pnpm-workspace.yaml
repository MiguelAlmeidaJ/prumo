packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  bcrypt: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 0

overrides:
  deepmerge-ts: 8.0.1
  "js-yaml@>=5.0.0 <5.2.2": "5.2.2"
  nanoid@<3.3.17: ^3.3.17
  postcss: "8.5.23"
  sharp: "0.35.0"
  uuid@<11.1.1: ^11.1.1
