services:
  postgres:
    image: postgres:17-alpine
    container_name: prumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prumo
      POSTGRES_USER: prumo
      POSTGRES_PASSWORD: prumo
    ports:
      - "5432:5432"
    volumes:
      - prumo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prumo -d prumo"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: prumo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - prumo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: prumo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: prumo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prumo
      MINIO_ROOT_PASSWORD: prumo-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prumo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 prumo prumo-development-only &&
        mc mb --ignore-existing local/prumo-documents &&
        mc anonymous set none local/prumo-documents
    restart: "no"

volumes:
  prumo_postgres_data:
  prumo_redis_data:
  prumo_minio_data:
